<!doctype html>
<!-- data-theme is in the markup, not only in main.tsx: the stylesheet is parsed
     before any module runs, and without it the first frame paints light. -->
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>handy</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
